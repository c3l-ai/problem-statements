# Site settings
# Title and description per LAK27_workshop_website_plan.md (configuration sketch)

title: A Dataset for Studying the History of Learning Analytics
description: Full-day workshop at LAK 2027 launching the LAK and JLA archive

# GitHub Pages project site (open decision 5: personal account).
# url + baseurl are required for correct asset and link paths.
url: https://ebbertd.github.io
baseurl: /lak27_problem_statements_workshop

permalink: pretty

# Theme (see plan: piazzai/jekyll-nagymaros). remote_theme needs no
# GitHub Actions workflow; Pages builds Jekyll natively.
remote_theme: piazzai/jekyll-nagymaros

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Destination of the header title button and the 404 return link.
home: /

# Unset: the theme suppresses the footer copyright notice entirely.
# copyright: Centre for Change and Complexity in Learning

# Keep crawlers out until launch; flip to true when publishing.
indexing: false

exclude:
  - LAK27_workshop_website_plan.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/

sass:
  sourcemap: never
  # The theme's own stylesheets use @import, which Dart Sass (used by
  # Jekyll 4 locally) deprecates; GitHub Pages' older stack does not
  # warn. Silence it locally only.
  silence_deprecations: import
